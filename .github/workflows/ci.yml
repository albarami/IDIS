          sudo -n GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" .venv/bin/python - <<'H1B_PY'
          import importlib.util
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path

          run = os.environ["GITHUB_RUN_ID"]
          image = "idis:ci-" + os.environ["GITHUB_SHA"]
          holder = f"idis-h1b-netns-{run}"
          root = Path(f"/opt/idis-ci-health/{run}/inputs")
          spec = importlib.util.spec_from_file_location(
              "ci_bootstrap_health", ".github/scripts/prepare_bootstrap_health.py"
          )
          helper = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = helper
          spec.loader.exec_module(helper)
          raw = subprocess.check_output(
              [
                  "docker", "image", "inspect",
                  "--format", "{{range .Config.Env}}{{println .}}{{end}}",
                  image,
              ],
              text=True,
          )
          image_defaults = {}
          for line in raw.splitlines():
              if "=" not in line:
                  continue
              name, value = line.split("=", 1)
              if name not in helper._IMAGE_CONTROL_NAMES:
                  raise SystemExit(1)
              image_defaults[name] = value
          defaults_path = Path(f"/opt/idis-ci-health/{run}/image-defaults.json")
          defaults_path.write_text(json.dumps(image_defaults))
          os.chown(defaults_path, 1000, 1000)
          os.chmod(defaults_path, 0o400)
          run_root = Path(f"/opt/idis-ci-health/{run}")
          lib = run_root / "lib"
          helper_copy = run_root / "prepare_bootstrap_health.py"
          subprocess.check_call(
              [
                  "sudo", "-n", "install", "-m", "0644", "-o", "1000", "-g", "1000",
                  ".github/scripts/prepare_bootstrap_health.py",
                  str(helper_copy),
              ]
          )

          def publish_file(source: Path, destination: Path) -> None:
              if source.is_symlink() and source.is_dir():
                  raise SystemExit(1)
              if not source.is_file():
                  raise SystemExit(1)
              inside = destination.parent == lib or lib in destination.parents
              if not inside:
                  raise SystemExit(1)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              os.chown(destination, 1000, 1000)
              os.chmod(destination, 0o644)
              current = destination.parent
              while current != run_root:
                  os.chown(current, 1000, 1000)
                  os.chmod(current, 0o755)
                  current = current.parent

          crypto_file = sys.modules["cryptography"].__file__
          cffi_file = sys.modules["_cffi_backend"].__file__
          idis_file = sys.modules["idis"].__file__
          if crypto_file is None or cffi_file is None or idis_file is None:
              raise SystemExit(1)
          crypto_root = Path(crypto_file).resolve()
          if crypto_root.name != "__init__.py":
              raise SystemExit(1)
          crypto_root = crypto_root.parent
          for path in crypto_root.rglob("*"):
              if "__pycache__" in path.parts or path.is_dir():
                  continue
              publish_file(path, lib / "cryptography" / path.relative_to(crypto_root))
          cffi_path = Path(cffi_file).resolve()
          publish_file(cffi_path, lib / cffi_path.name)
          idis_root = Path(idis_file).resolve().parent
          for relative in (
              Path("__init__.py"),
              Path("runtime") / "__init__.py",
              Path("runtime") / "profile.py",
              Path("runtime") / "secure_files.py",
              Path("runtime") / "strict_auth.py",
          ):
              publish_file(idis_root / relative, lib / "idis" / relative)
          qualify = r"""
          import importlib.util, json, os
          import sys
          from pathlib import Path
          run = os.environ["GITHUB_RUN_ID"]
          spec = importlib.util.spec_from_file_location(
              "ci_bootstrap_health",
              f"/opt/idis-ci-health/{run}/prepare_bootstrap_health.py",
          )
          helper = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = helper
          spec.loader.exec_module(helper)
          image_defaults = json.loads(Path(f"/opt/idis-ci-health/{run}/image-defaults.json").read_text())
          root = Path(f"/opt/idis-ci-health/{run}/inputs")
          startup = dict(image_defaults)
          startup["IDIS_STRICT_DOTENV_PATH"] = str(root / "api" / "synthetic-bootstrap.env")
          import hashlib
          digest = hashlib.sha256((root / "manifest.json").read_bytes()).hexdigest()
          helper.qualify_inputs(
              helper.PreparedInputs(root=root, manifest_sha256=digest),
              startup_env=startup,
              image_defaults=image_defaults,
          )
          print(json.dumps({"phase": "qualify", "code": "OK"}, sort_keys=True))
          """
          script_path = Path(f"/opt/idis-ci-health/{run}/qualify.py")
          script_path.write_text(qualify)
          os.chown(script_path, 1000, 1000)
          os.chmod(script_path, 0o500)
          interpreter = os.path.realpath(sys.executable)
          workspace = os.environ["GITHUB_WORKSPACE"]
          for prefix in (workspace, "/home/runner"):
              if (
                  interpreter == prefix
                  or interpreter.startswith(prefix + "/")
                  or interpreter.startswith(prefix + os.sep)
              ):
                  raise SystemExit(1)
          if not os.path.isfile(interpreter):
              raise SystemExit(1)
          subprocess.check_call(
              [
                  "sudo", "-n", "-u", "#1000",
                  "GITHUB_RUN_ID=" + run,
                  "PYTHONPATH=" + str(lib),
                  interpreter,
                  "-S",
                  str(script_path),
              ],
              cwd=str(run_root),
          )
          dotenv = str(root / "api" / "synthetic-bootstrap.env")
          objects = Path(f"/opt/idis-ci-health/{run}/object-path").read_text().strip()
          model = "/opt/idis-models/0d3d19a32d3338f10357c0889762bd8d64bbdeba"
          redis_name = f"idis-h1b-redis-{run}"
          env_lines = Path(f"/opt/idis-ci-health/{run}/datastore.env").read_text().splitlines()
          redis_password = ""
          for line in env_lines:
              name, value = line.split("=", 1)
              if name == "REDIS_PASSWORD":
                  redis_password = value
          if not re.fullmatch(r"[A-Za-z0-9_-]+", redis_password):
              raise SystemExit(1)
          probe_env = os.environ.copy()
          probe_env["REDISCLI_AUTH"] = redis_password
          deadline = time.time() + 30
          ready = False
          while time.time() < deadline:
              probe = subprocess.run(
                  [
                      "docker", "exec", "-e", "REDISCLI_AUTH", redis_name,
                      "redis-cli", "-h", "127.0.0.1", "ping",
                  ],
                  env=probe_env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if probe.returncode == 0:
                  ready = True
                  break
              time.sleep(1)
          if not ready:
              print(json.dumps({"phase": "redis", "code": "CI_HEALTH_DATASTORE_TIMEOUT"}, sort_keys=True))
              raise SystemExit(1)
          api = f"idis-h1b-api-{run}"
          child_env = os.environ.copy()
          child_env["IDIS_STRICT_DOTENV_PATH"] = dotenv
          subprocess.check_call(
              [
                  "docker", "run", "-d", "--name", api,
                  "--network", f"container:{holder}",
                  "--read-only",
                  "--tmpfs", "/tmp:rw,nosuid,size=2147483648",
                  "-v", f"{root}:{root}:ro",
                  "-v", f"{model}:{model}:ro",
                  "-v", f"{objects}:{objects}",
                  "-e", "IDIS_STRICT_DOTENV_PATH",
