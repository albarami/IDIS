name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  # --isolated ignores user settings; this also disables global/site pip config.
  PIP_CONFIG_FILE: /dev/null
jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - {"name": "Checkout code", "uses": "actions/checkout@v4"}
      - {"name": "Set up Node.js 20", "uses": "actions/setup-node@v4", "with": {"node-version": "20", "cache": "npm", "cache-dependency-path": "ui/package-lock.json"}}
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Run lint
        working-directory: ui
        run: npm run lint
      - name: Run typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Run tests
        working-directory: ui
        run: npm run test
      - name: Build
        working-directory: ui
        run: npm run build
  check:
    runs-on: ubuntu-latest
    environment: cir04-private-inputs
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 360
    concurrency:
      group: cir04-private-check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Public reviewed bootstrap pin, not an admission token or mutable repository variable.
      IDIS_BOOTSTRAP_SHA256: ff5cba5bd92683d4d4e5b9fc101f74006899d3f9863b1ee02ffb9e0025e148e6
      IDIS_WORKFLOW_SHA: ${{ github.workflow_sha }}
    services:
      # Public registry raw linux/amd64 manifest qualified; no mutable-image fallback.
      postgres:
        image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp
      # Slice96 DEC-A: a real Redis so the cross-replica rate-limit integration test
      # (test_real_redis_enforces_one_shared_bucket_across_replicas) runs here instead of skipping.
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379/tcp
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed v4 main + post
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
      - name: Validate genuine exact-run approval without recovery secret
        id: private-admission
        env:
          IDIS_CI_READ_TOKEN: ${{ github.token }}
        run: |
          set +x
          if [[ -v RUNNER_DEBUG || -v ACTIONS_STEP_DEBUG ]]; then exit 1; fi
          for name in $(compgen -A variable GIT_TRACE); do unset "$name"; done
          unset GIT_CURL_VERBOSE
          umask 077
          root="$RUNNER_TEMP/idis-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$root"
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:scripts/ci_private_inputs.py" > "$root/bootstrap.py"
          printf '%s  %s\n' "$IDIS_BOOTSTRAP_SHA256" "$root/bootstrap.py" | sha256sum --check --status
          /usr/bin/python3 -I -S "$root/bootstrap.py" admit
      - name: Fetch exact recovery raw blobs into private staging
        id: private-fetch
        env:
          IDIS_RECOVERY_READ_KEY: ${{ secrets.IDIS_RECOVERY_READ_KEY }}
        run: |
          set +x
          if [[ -v RUNNER_DEBUG || -v ACTIONS_STEP_DEBUG ]]; then exit 1; fi
          for name in $(compgen -A variable GIT_TRACE); do unset "$name"; done
          unset GIT_CURL_VERBOSE
          umask 077
          root="$RUNNER_TEMP/idis-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:scripts/ci_private_inputs.py" > "$root/fetch-bootstrap.py"
          printf '%s  %s\n' "$IDIS_BOOTSTRAP_SHA256" "$root/fetch-bootstrap.py" | sha256sum --check --status
          /usr/bin/python3 -I -S "$root/fetch-bootstrap.py" fetch
      - {"name": "Set up Python 3.11", "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", "with": {"python-version": "3.11"}}
      - name: Install OCR and media system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple "pip==26.2.1"
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -c requirements/constraints-py311.txt --build-constraint requirements/constraints-py311.txt -e ".[dev]" setuptools wheel
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_dependency_resolution.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - {"name": "Enforce authorized migration ceiling before checks", "run": "python scripts/check_migration_ceiling.py"}
      - name: Qualify exclusive required-caller database without global DB exports
        id: required-callers-setup
        env:
          IDIS_PG_HOST: "127.0.0.1"
          IDIS_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          IDIS_CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          PG_ADMIN_USER: postgres
          PG_ADMIN_PASSWORD: postgres
          IDIS_PG_APP_USER: idis_app
          IDIS_PG_APP_PASSWORD: idis_app_pw
        run: python scripts/pg_bootstrap_ci.py --required-preview check
      - {"name": "Provision Redis URL for the cross-replica rate-limit integration test (Slice96 DEC-A)", "run": "echo \"IDIS_TEST_REDIS_URL=redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/15\" >> \"$GITHUB_ENV\""}
      - {"name": "Validate prompt registry governance (Slice99)", "run": "python -m idis prompts validate --prompts-root prompts --repo-root . --out prompt_governance_report.json"}
      - {"name": "Verify OpenAPI/schema/client contract lock (Slice99)", "run": "python scripts/contract_lock.py verify --repo-root ."}
      - {"name": "Upload prompt governance report", "if": "always()", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02", "with": {"name": "prompt-governance-report", "path": "prompt_governance_report.json", "retention-days": 30}}
      - name: Revalidate admission and overlay exact private bytes no-clobber
        id: private-overlay
        env:
          IDIS_CI_READ_TOKEN: ${{ github.token }}
        run: |
          set +x
          if [[ -v RUNNER_DEBUG || -v ACTIONS_STEP_DEBUG ]]; then exit 1; fi
          for name in $(compgen -A variable GIT_TRACE); do unset "$name"; done
          unset GIT_CURL_VERBOSE
          umask 077
          root="$RUNNER_TEMP/idis-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:scripts/ci_private_inputs.py" > "$root/overlay-bootstrap.py"
          printf '%s  %s\n' "$IDIS_BOOTSTRAP_SHA256" "$root/overlay-bootstrap.py" | sha256sum --check --status
          /usr/bin/python3 -I -S "$root/overlay-bootstrap.py" overlay
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:scripts/ci_private_inputs.py" > "$root/capture-bootstrap.py"
          printf '%s  %s\n' "$IDIS_BOOTSTRAP_SHA256" "$root/capture-bootstrap.py" | sha256sum --check --status
      - name: Derive labelled v27 staging bytes with existing tools
        shell: /usr/bin/python3 -I -S -c "import os,sys; p=os.path.join(os.environ['RUNNER_TEMP'],'idis-ci-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'capture-bootstrap.py'); os.execv('/usr/bin/python3',['/usr/bin/python3','-I','-S',p,'prepare',sys.argv[1]])" "{0}"
        run: |
          mkdir -p .local_reports/slice100/task8/v27-candidate
          python scripts/materialize_full_strict_v27_preimage.py --staging-output .local_reports/slice100/task8/v27-candidate/full_strict_v27_reviewed_preimage_v1.json
          python scripts/generate_task8_v27_contract_fixtures.py --parent-artifact contracts/full_strict_v21_reviewed_preimage_v1.json --policy-artifact contracts/fdd_formula_policy_v2.json --reviewer-map docs/plans/2026-07-25-slice100-task8-fdd-formula-policy-v2-review-map.md --staged-artifact .local_reports/slice100/task8/v27-candidate/full_strict_v27_reviewed_preimage_v1.json --staging-output .local_reports/slice100/task8/v27-candidate/full_strict_v27_contract_hash_v1.json
          python scripts/verify_full_strict_v27_fixture_independently.py --mode verify --parent contracts/full_strict_v21_reviewed_preimage_v1.json --policy contracts/fdd_formula_policy_v2.json --reviewer-map docs/plans/2026-07-25-slice100-task8-fdd-formula-policy-v2-review-map.md --artifact .local_reports/slice100/task8/v27-candidate/full_strict_v27_reviewed_preimage_v1.json --fixture .local_reports/slice100/task8/v27-candidate/full_strict_v27_contract_hash_v1.json
          printf '%s\n' '4169371675ce32c2b4b459528dcdf21914887941d952648597bce59e49a8ac06  .local_reports/slice100/task8/v27-candidate/full_strict_v27_reviewed_preimage_v1.json' '78a3aedb04260cc56e98a2a9193ce489ca73bd4b5b95fc1486f676bfbd07b0cf  .local_reports/slice100/task8/v27-candidate/full_strict_v27_contract_hash_v1.json' | sha256sum --check --status
      - name: Fetch exact historical commit before offline checks
        id: historical-source-fetch
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin 17c2b3b265b3c09121febd90c61a368e827a00ab
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" rev-parse --verify 17c2b3b265b3c09121febd90c61a368e827a00ab^{commit}
          test "$(env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" rev-parse 17c2b3b265b3c09121febd90c61a368e827a00ab:src/idis/persistence/db.py)" = 4f9818e15368641d252607edcad29b0a57e1832f
          test "$(env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" rev-parse 17c2b3b265b3c09121febd90c61a368e827a00ab:src/idis/models/run_step.py)" = 286209b55f4406921fa312b451be6f8c1ca5e330
      - name: Run all checks
        shell: /usr/bin/python3 -I -S -c "import os,sys; p=os.path.join(os.environ['RUNNER_TEMP'],'idis-ci-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'capture-bootstrap.py'); os.execv('/usr/bin/python3',['/usr/bin/python3','-I','-S',p,'capture',sys.argv[1]])" "{0}"
        run: make check
      - name: Remove only validated invocation-owned overlay files
        if: always()
        run: |
          set +x
          if [[ -v RUNNER_DEBUG || -v ACTIONS_STEP_DEBUG ]]; then exit 1; fi
          root="$RUNNER_TEMP/idis-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ ! -d "$root" ]]; then exit 0; fi
          env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null -c protocol.file.allow=never -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:scripts/ci_private_inputs.py" > "$root/cleanup-bootstrap.py"
          printf '%s  %s\n' "$IDIS_BOOTSTRAP_SHA256" "$root/cleanup-bootstrap.py" | sha256sum --check --status
          /usr/bin/python3 -I -S "$root/cleanup-bootstrap.py" cleanup
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp
    env:
      PG_ADMIN_USER: postgres
      PG_ADMIN_PASSWORD: postgres
      IDIS_PG_APP_USER: idis_app
      IDIS_PG_APP_PASSWORD: idis_app_pw
      IDIS_PG_DB_NAME: idis_test
    steps:
      - {"name": "Checkout code", "uses": "actions/checkout@v4"}
      - name: Mask secrets
        run: |
          echo "::add-mask::${PG_ADMIN_PASSWORD}"
          echo "::add-mask::${IDIS_PG_APP_PASSWORD}"

      - name: Set Postgres host and port
        run: |
          echo "IDIS_PG_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "IDIS_PG_PORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"

      - {"name": "Set up Python 3.11", "uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}
      - name: Install dependencies
        id: pg-install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple "pip==26.2.1"
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -c requirements/constraints-py311.txt --build-constraint requirements/constraints-py311.txt -e ".[dev]" setuptools wheel
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_dependency_resolution.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Gates the database phases: this step has no if, so a failure skips later default-gated steps.
      - name: Install native OCR inputs
        id: pg-native-inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils tesseract-ocr tesseract-ocr-eng

      - {"name": "Enforce authorized migration ceiling before PostgreSQL bootstrap", "id": "pg-ceiling", "run": "python scripts/check_migration_ceiling.py"}
      - name: Prepare exact migration 0038 roles on disposable CI
        id: pg-roles
        env:
          IDIS_CI_ERASURE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          IDIS_REQUIRE_POSTGRES: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -p pytest_socket tests/test_ci_erasure_role_preparation.py -q --disable-socket --allow-hosts=127.0.0.1,::1
          python scripts/prepare_ci_erasure_roles.py --disposable-ci

      - name: Bootstrap PostgreSQL and export env
        id: pg-bootstrap
        run: |
          python scripts/pg_bootstrap_ci.py --export-github-env 2>&1 | tee postgres_bootstrap.log
          exit ${PIPESTATUS[0]}

      - {"name": "Verify app role connectivity and security", "id": "pg-verify", "run": "python scripts/pg_bootstrap_ci.py --verify-only"}
      - name: Set up independent exclusive C3 database before original tests
        id: c3-setup
        env:
          IDIS_CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          env -u IDIS_DATABASE_URL -u IDIS_DATABASE_ADMIN_URL -u IDIS_DATABASE_ERASURE_URL -u IDIS_ERASURE_DATABASE_URL -u IDIS_REQUIRE_POSTGRES python scripts/pg_bootstrap_ci.py --required-preview postgres
      - name: Run PostgreSQL integration tests
        id: pg-tests
        env:
          IDIS_REQUIRE_POSTGRES: "1"
        run: |
          echo "=== Postgres Integration Tests (IDIS_REQUIRE_POSTGRES=1) ==="
          echo "Test files: test_postgres_rls_and_audit_immutability.py, test_api_deals_postgres.py, test_api_claims_postgres.py, test_postgres_break_attempts.py, test_api_run_observability_postgres.py, test_api_default_upload_ingestion_postgres.py, test_api_full_run_step_name_postgres.py, test_api_full_run_durable_evidence_postgres.py, test_api_selected_multidocument_full_acceptance_postgres.py, test_api_sanad_auto_grade_persistence_postgres.py, test_slice96_provider_budget_postgres.py (Slice96 DEC-C durable provider budget), test_slice96_idempotency_ttl_postgres.py (Slice96 DEC-E idempotency TTL cleanup), test_slice97_webhook_outbox_postgres.py (Slice97 durable webhook outbox), test_slice97_webhook_dispatcher_postgres.py (Slice97 webhook dispatcher), test_slice98_abac_durable_store_postgres.py, test_slice98_access_admin_api_postgres.py, test_slice98_break_glass_workflow_postgres.py, test_slice98_byok_legal_hold_postgres.py, test_slice98_durable_residency_postgres.py, test_slice98_erasure_export_postgres.py, test_slice98_retention_janitor_postgres.py (Slice98 durable auth/ABAC/compliance)"
          pytest tests/test_postgres_rls_and_audit_immutability.py tests/test_api_deals_postgres.py tests/test_api_claims_postgres.py tests/test_postgres_break_attempts.py tests/test_api_run_observability_postgres.py tests/test_api_default_upload_ingestion_postgres.py tests/test_api_full_run_step_name_postgres.py tests/test_api_full_run_durable_evidence_postgres.py tests/test_api_selected_multidocument_full_acceptance_postgres.py tests/test_api_sanad_auto_grade_persistence_postgres.py tests/test_slice96_provider_budget_postgres.py tests/test_slice96_idempotency_ttl_postgres.py tests/test_slice97_webhook_outbox_postgres.py tests/test_slice97_webhook_dispatcher_postgres.py tests/test_slice98_abac_durable_store_postgres.py tests/test_slice98_access_admin_api_postgres.py tests/test_slice98_break_glass_workflow_postgres.py tests/test_slice98_byok_legal_hold_postgres.py tests/test_slice98_durable_residency_postgres.py tests/test_slice98_erasure_export_postgres.py tests/test_slice98_retention_janitor_postgres.py -v --junitxml=postgres_integration_pytest.xml 2>&1 | tee postgres_integration_pytest.log
          exit ${PIPESTATUS[0]}

      - name: Reject skipped tests in the original PostgreSQL invocation
        id: pg-zero-skip
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres_integration_pytest.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if skipped > 0:
              raise SystemExit("REQUIRED_PYTEST_SKIPPED")
          PY

      - name: Run required C2 and C3 PostgreSQL modules independently (REQUIRED)
        id: c3-tests
        if: ${{ !cancelled() && steps.pg-install.outcome == 'success' && steps.pg-ceiling.outcome == 'success' && steps.pg-roles.outcome == 'success' && steps.pg-bootstrap.outcome == 'success' && steps.pg-verify.outcome == 'success' && steps.c3-setup.outcome == 'success' }}
        env:
          IDIS_CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          env -u IDIS_DATABASE_URL -u IDIS_DATABASE_ADMIN_URL -u IDIS_DATABASE_ERASURE_URL -u IDIS_ERASURE_DATABASE_URL -u IDIS_REQUIRE_POSTGRES python scripts/pg_bootstrap_ci.py --run-required-preview-postgres 2>&1 | tee c3_postgres_integration_pytest.log
          exit ${PIPESTATUS[0]}

      - name: Reject skipped tests in the required C2 and C3 invocation
        id: c3-zero-skip
        if: ${{ !cancelled() && steps.c3-tests.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("c3_postgres_integration_pytest.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if skipped > 0:
              raise SystemExit("REQUIRED_PYTEST_SKIPPED")
          PY

      - name: Run required dev-0039 restart node
        id: c3-dev0039-restart
        if: ${{ !cancelled() && steps.pg-install.outcome == 'success' && steps.pg-ceiling.outcome == 'success' && steps.pg-roles.outcome == 'success' && steps.pg-bootstrap.outcome == 'success' && steps.pg-verify.outcome == 'success' && steps.c3-setup.outcome == 'success' }}
        env:
          IDIS_CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          env -u IDIS_DATABASE_URL -u IDIS_DATABASE_ADMIN_URL -u IDIS_DATABASE_ERASURE_URL -u IDIS_ERASURE_DATABASE_URL -u IDIS_REQUIRE_POSTGRES python scripts/pg_bootstrap_ci.py --run-required-dev0039-restart 2>&1 | tee c3_dev0039_restart_pytest.log
          exit ${PIPESTATUS[0]}
      - name: Reject skipped tests in the required dev-0039 restart invocation
        id: c3-dev0039-zero-skip
        if: ${{ !cancelled() && steps.c3-dev0039-restart.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("c3_dev0039_restart_pytest.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if skipped > 0:
              raise SystemExit("REQUIRED_PYTEST_SKIPPED")
          PY
      - name: Run required dev-0039 historical restart node
        id: dev0039-historical
        if: ${{ !cancelled() && steps.pg-install.outcome == 'success' && steps.pg-ceiling.outcome == 'success' && steps.pg-roles.outcome == 'success' && steps.pg-bootstrap.outcome == 'success' && steps.pg-verify.outcome == 'success' && steps.c3-setup.outcome == 'success' }}
        env:
          IDIS_CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          env -u IDIS_DATABASE_URL -u IDIS_DATABASE_ADMIN_URL -u IDIS_DATABASE_ERASURE_URL -u IDIS_ERASURE_DATABASE_URL -u IDIS_REQUIRE_POSTGRES python scripts/pg_bootstrap_ci.py --run-required-dev0039-historical 2>&1 | tee dev0039_historical_restart_pytest.log
          exit ${PIPESTATUS[0]}
      - name: Reject skipped tests in the required dev-0039 historical invocation
        id: dev0039-historical-zero-skip
        if: ${{ !cancelled() && steps.dev0039-historical.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("dev0039_historical_restart_pytest.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if skipped > 0:
              raise SystemExit("REQUIRED_PYTEST_SKIPPED")
          PY

      - name: Fence dev-only scripts out of the sdist and wheel
        id: pg-archive-fence
        if: ${{ !cancelled() && steps.pg-install.outcome == 'success' }}
        run: |
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -c requirements/constraints-py311.txt "hatchling==1.32.4"
          .venv/bin/python -m pip show hatchling
          .venv/bin/python -m hatchling build -t sdist -t wheel -d "$RUNNER_TEMP/idis-archive-fence"
          .venv/bin/python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "idis-archive-fence"
          files = [path for path in root.iterdir() if path.is_file()]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          wheels = [path for path in files if path.suffix == ".whl"]
          if len(sdists) != 1 or len(wheels) != 1:
              raise SystemExit(1)
          if {path.name for path in files} != {sdists[0].name, wheels[0].name}:
              raise SystemExit(1)

          def names(path: Path) -> list[str]:
              if path.name.endswith(".tar.gz"):
                  with tarfile.open(path) as archive:
                      return archive.getnames()
              with zipfile.ZipFile(path) as archive:
                  return archive.namelist()

          def norm(name: str) -> str:
              return name.replace(chr(92), "/").lstrip("./")

          def dev_only(name: str) -> bool:
              text = norm(name)
              return text.startswith("scripts/dev_only/") or "/scripts/dev_only/" in "/" + text

          def wheel_scripts(name: str) -> bool:
              text = norm(name)
              return text == "scripts" or text.startswith("scripts/") or "/scripts/" in "/" + text

          for member in names(sdists[0]):
              if dev_only(member):
                  raise SystemExit(1)
          for member in names(wheels[0]):
              if dev_only(member) or wheel_scripts(member):
                  raise SystemExit(1)
          PY
      - {"name": "Upload bootstrap log artifact", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "postgres-bootstrap-log", "path": "postgres_bootstrap.log", "retention-days": 7}}
      - {"name": "Upload pytest log artifact", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "postgres-integration-pytest-log", "path": "postgres_integration_pytest.log\nc3_postgres_integration_pytest.log\nc3_dev0039_restart_pytest.log\ndev0039_historical_restart_pytest.log", "retention-days": 7}}
      - {"name": "Upload pytest JUnit XML artifact", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "postgres-integration-pytest-xml", "path": "postgres_integration_pytest.xml\nc3_postgres_integration_pytest.xml\nc3_dev0039_restart_pytest.xml\ndev0039_historical_restart_pytest.xml", "retention-days": 7}}
      - name: Write explicit pytest summary to job summary
        if: always()
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import os

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")

          try:
              tree = ET.parse("postgres_integration_pytest.xml")
              root = tree.getroot()
              testsuite = root.find("testsuite") if root.tag != "testsuite" else root
              if testsuite is None:
                  testsuite = root

              tests = int(testsuite.get("tests", 0))
              failures = int(testsuite.get("failures", 0))
              errors = int(testsuite.get("errors", 0))
              skipped = int(testsuite.get("skipped", 0))
              passed = tests - failures - errors - skipped

              with open(summary_file, "a") as f:
                  f.write("## Postgres Integration Pytest Results\n\n")
                  f.write(f"**Postgres integration pytest: {passed} passed, {skipped} skipped**\n\n")
                  if failures > 0 or errors > 0:
                      f.write(f"[WARN] Failures: {failures}, Errors: {errors}\n\n")
          except Exception as e:
              with open(summary_file, "a") as f:
                  f.write(f"## Postgres Integration Pytest Results\n\n")
                  f.write(f"[WARN] Could not parse JUnit XML: {e}\n\n")
          with open(summary_file, "a") as f:
              f.write("## Required C3 PostgreSQL Results\n\n")
              f.write("Step outcome: ${{ steps.c3-tests.outcome }}\n\n")
              try:
                  root = ET.parse("c3_postgres_integration_pytest.xml").getroot()
                  suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
                  if not suites:
                      raise ValueError("missing suite")
                  totals = {name: sum(int(s.get(name, 0)) for s in suites) for name in ("tests", "failures", "errors", "skipped")}
                  passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
                  f.write(f"{passed} passed, {totals['failures']} failed, {totals['errors']} errors, {totals['skipped']} skipped.\n")
              except Exception:
                  f.write("NOT QUALIFIED: C3 XML absent or invalid; no passing result inferred.\n")
          with open(summary_file, "a") as f:
              f.write("## Required dev-0039 restart results\n\n")
              f.write("Step outcome: ${{ steps.c3-dev0039-restart.outcome }}\n\n")
              try:
                  root = ET.parse("c3_dev0039_restart_pytest.xml").getroot()
                  suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
                  if not suites:
                      raise ValueError("missing suite")
                  totals = {name: sum(int(s.get(name, 0)) for s in suites) for name in ("tests", "failures", "errors", "skipped")}
                  passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
                  f.write(f"{passed} passed, {totals['failures']} failed, {totals['errors']} errors, {totals['skipped']} skipped.\n")
              except Exception:
                  f.write("NOT QUALIFIED: dev-0039 restart XML absent or invalid; no passing result inferred.\n")
          with open(summary_file, "a") as f:
              f.write("## Required dev-0039 historical results\n\n")
              f.write("Step outcome: ${{ steps.dev0039-historical.outcome }}\n\n")
              try:
                  root = ET.parse("dev0039_historical_restart_pytest.xml").getroot()
                  suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
                  if not suites:
                      raise ValueError("missing suite")
                  totals = {name: sum(int(s.get(name, 0)) for s in suites) for name in ("tests", "failures", "errors", "skipped")}
                  passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
                  f.write(f"{passed} passed, {totals['failures']} failed, {totals['errors']} errors, {totals['skipped']} skipped.\n")
              except Exception:
                  f.write("NOT QUALIFIED: dev-0039 historical XML absent or invalid; no passing result inferred.\n")
          EOF

      - name: Write logs summary to job summary
        if: always()
        run: |
          echo "## PostgreSQL Bootstrap Log (last 30 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 postgres_bootstrap.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No bootstrap log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## PostgreSQL Integration Test Results (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 postgres_integration_pytest.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No pytest log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  evaluation-harness:
    runs-on: ubuntu-latest
    steps:
      - {"name": "Checkout code", "uses": "actions/checkout@v4"}
      - {"name": "Set up Python 3.11", "uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple "pip==26.2.1"
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -c requirements/constraints-py311.txt --build-constraint requirements/constraints-py311.txt -e ".[dev]" setuptools wheel
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_dependency_resolution.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run GDBS-S evaluation harness (validate mode + drift gate)
        run: |
          echo "=== Running GDBS-S Evaluation Harness (validate mode, drift-gated) ==="
          # gdbs_mini fixture + pinned baseline: any nonzero exit (drift, blocked, or a
          # missing/malformed baseline) fails this step directly under bash errexit (Slice99)
          python -m idis test gdbs-s --dataset tests/fixtures/gdbs_mini --baseline tests/fixtures/gdbs_baseline/gdbs_mini_gdbs_s_baseline.json --out gdbs_s_report.json
          echo "[OK] GDBS-S validation + drift gate PASSED"

      - name: Display GDBS-S report
        if: always()
        run: |
          echo "=== GDBS-S Report ===" 
          cat gdbs_s_report.json 2>/dev/null || echo "No report file found"

      - {"name": "Upload GDBS-S report artifact", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "gdbs-s-evaluation-report", "path": "gdbs_s_report.json", "retention-days": 30}}
      - name: Write evaluation summary to job summary
        if: always()
        run: |
          echo "## GDBS-S Evaluation Harness Results" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat gdbs_s_report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '{"error": "No report generated"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Container Build Validation
  # ===========================================================================
  container-build:
    runs-on: ubuntu-latest
    steps:
      - {"name": "Checkout code", "uses": "actions/checkout@v4"}
      - {"name": "Set up Docker Buildx", "uses": "docker/setup-buildx-action@v3"}
      - {"name": "Build Docker image", "uses": "docker/build-push-action@v5", "with": {"context": ".", "file": "./Dockerfile", "push": false, "load": true, "tags": "idis:ci-${{ github.sha }}", "cache-from": "type=gha", "cache-to": "type=gha,mode=max"}}
      - name: Set up Python 3.11 for composition
        id: setup-composition
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install composition interpreter
        id: install-composition
        if: success()
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple "pip==26.2.1"
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -c requirements/constraints-py311.txt --build-constraint requirements/constraints-py311.txt -e ".[dev]" setuptools wheel
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_dependency_resolution.py
      - name: Reject image env names outside the reviewed allowlist
        id: inspect-image-env
        if: success()
        run: |
          set -euo pipefail
          .venv/bin/python - <<'H1B_PY'
          import hashlib
          import importlib.util
          import json
          import os
          import subprocess
          import sys

          spec = importlib.util.spec_from_file_location(
              "ci_bootstrap_health", ".github/scripts/prepare_bootstrap_health.py"
          )
          helper = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = helper
          spec.loader.exec_module(helper)
          raw = subprocess.check_output(
              [
                  "docker",
                  "image",
                  "inspect",
                  "--format",
                  "{{range .Config.Env}}{{println .}}{{end}}",
                  "idis:ci-" + os.environ["GITHUB_SHA"],
              ],
              text=True,
          )
          names = sorted(
              line.split("=", 1)[0] for line in raw.splitlines() if "=" in line
          )
          extra = sorted(set(names) - set(helper._IMAGE_CONTROL_NAMES))
          print(
              json.dumps(
                  {
                      "phase": "image-env",
                      "extra_names": extra,
                      "names_sha256": hashlib.sha256(
                          ("\n".join(names) + "\n").encode()
                      ).hexdigest(),
                  },
                  sort_keys=True,
              )
          )
          if extra:
              sys.exit(1)
          H1B_PY
      - name: Reject gate Task4 and unsigned envelopes before any container start
        id: signature-and-gate-negatives
        if: success()
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q --disable-socket \
            tests/test_ci_bootstrap_health_composition.py::test_unsigned_deny_files_and_invalid_signatures_remain_canonically_rejected \
            tests/test_ci_bootstrap_health_composition.py::test_only_unchanged_default_api_command_may_cross_consumer_boundary \
            tests/test_ci_bootstrap_health_composition.py::test_zero_call_cap_does_not_become_full_budget_admission
      - name: Restore pinned tiny.en model cache
        id: model-cache
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: model-cache/0d3d19a32d3338f10357c0889762bd8d64bbdeba
          key: h1b-tiny-en-0d3d19a32d3338f10357c0889762bd8d64bbdeba-8a9f6ac2c61d339ea4f5a27d00934ea5fe83bcb0d25b67a01cd3b47b9e1adf34
      - name: Fetch pinned tiny.en model on cache miss
        id: model-fetch
        if: "success() && steps.model-cache.outputs.cache-hit != 'true'"
        run: |
          set -euo pipefail
          rev=0d3d19a32d3338f10357c0889762bd8d64bbdeba
          dest="model-staging/${rev}"
          mkdir -p "$dest"
          base="https://huggingface.co/Systran/faster-whisper-tiny.en/resolve/${rev}"
          curl --fail --location --silent --show-error --output "${dest}/README.md" "${base}/README.md"
          curl --fail --location --silent --show-error --output "${dest}/config.json" "${base}/config.json"
          curl --fail --location --silent --show-error --output "${dest}/model.bin" "${base}/model.bin"
          curl --fail --location --silent --show-error --output "${dest}/tokenizer.json" "${base}/tokenizer.json"
          curl --fail --location --silent --show-error --output "${dest}/vocabulary.txt" "${base}/vocabulary.txt"
      - name: Verify pinned tiny.en hashes and install the model tree
        id: model-verify
        if: success()
        run: |
          set -euo pipefail
          .venv/bin/python - <<'H1B_PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          from idis.parsers.media import fingerprint_local_faster_whisper_model

          revision = "0d3d19a32d3338f10357c0889762bd8d64bbdeba"
          linux_pin = "4b1662df734cdf3854f6a3de0a9fd9c3fdaadfa644d6c7471f5c63c9cb62f6e5"
          windows_receipt = "47e043de5fce0c94a30e264cb503f65ccb69cf03b6db296fa14e937a0ab81aea"
          manifest_sha256 = "8a9f6ac2c61d339ea4f5a27d00934ea5fe83bcb0d25b67a01cd3b47b9e1adf34"
          expected = {
              "README.md": (1323, "1b7816626bf0548e4b71a467f4112b4592924bc818e3117f19aefcc50ce4b6aa"),
              "config.json": (2317, "14b1b421a90349bc551b881461426b561a874049cb9e4c4864f2ca384f6a7cc5"),
              "model.bin": (75537502, "1a5afae06a4db91c975c9a9d78be5cc110ee4ea022ad57d55492e4550e936b2a"),
              "tokenizer.json": (2128466, "929c5252409436dce1b38a75d1abbcb5e132d170d8e324e4e04ed915fa2d22df"),
              "vocabulary.txt": (422309, "ff77588746d3a2595d32ab5b69ffd7b95ce2441ac57533cb66fc3eb575a115cf"),
          }
          cache_hit = os.environ.get("MODEL_CACHE_HIT") == "true"
          staging = Path("model-staging") / revision
          cached = Path("model-cache") / revision
          source = cached if cache_hit else staging
          if not source.is_dir():
              sys.exit(1)
          names = {path.name for path in source.iterdir()}
          if names != set(expected):
              sys.exit(1)
          files = {}
          for name, (size, digest) in expected.items():
              path = source / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size != size:
                  sys.exit(1)
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != digest:
                  sys.exit(1)
              files[name] = {"bytes": size, "sha256": digest}
          fingerprint = fingerprint_local_faster_whisper_model(source)
          if fingerprint != linux_pin:
              sys.exit(1)
          if not cache_hit:
              cached.parent.mkdir(parents=True, exist_ok=True)
              if cached.exists():
                  shutil.rmtree(cached)
              shutil.copytree(staging, cached)
          destination = Path("/opt/idis-models") / revision
          subprocess.check_call(["sudo", "-n", "install", "-d", "-m", "0755", str(destination)])
          for name in expected:
              subprocess.check_call(
                  ["sudo", "-n", "install", "-m", "0644", str(cached / name), str(destination / name)]
              )
          run = os.environ["GITHUB_RUN_ID"]
          run_root = Path("/opt/idis-ci-health") / run
          subprocess.check_call(
              ["sudo", "-n", "install", "-d", "-m", "0700", "-o", "1000", "-g", "1000", str(run_root)]
          )
          receipt = {
              "files": files,
              "model_tree_fingerprint_linux": linux_pin,
              "model_tree_fingerprint_windows_receipt": windows_receipt,
              "manifest_sha256": manifest_sha256,
              "revision": revision,
          }
          encoded = json.dumps(receipt, sort_keys=True)
          subprocess.run(
              ["sudo", "-n", "tee", str(run_root / "model-verified.json")],
              input=encoded.encode(),
              stdout=subprocess.DEVNULL,
              check=True,
          )
          subprocess.check_call(["sudo", "-n", "chmod", "0644", str(run_root / "model-verified.json")])
          print(
              json.dumps(
                  {
                      "phase": "model",
                      "code": "PRESENT",
                      "manifest_sha256": manifest_sha256,
                      "model_tree_fingerprint_linux": linux_pin,
                      "model_tree_fingerprint_windows_receipt": windows_receipt,
                  },
                  sort_keys=True,
              )
          )
          H1B_PY
        env:
          MODEL_CACHE_HIT: ${{ steps.model-cache.outputs.cache-hit }}
      - name: Save pinned tiny.en model cache
        id: model-cache-save
        if: "success() && steps.model-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: model-cache/0d3d19a32d3338f10357c0889762bd8d64bbdeba
          key: h1b-tiny-en-0d3d19a32d3338f10357c0889762bd8d64bbdeba-8a9f6ac2c61d339ea4f5a27d00934ea5fe83bcb0d25b67a01cd3b47b9e1adf34
      - name: Prepare synthetic profile as root for uid 1000
        id: prepare-inputs
        if: success()
        run: |
          set -euo pipefail
          sudo install -d -m 0700 -o 1000 -g 1000 "/opt/idis-ci-health/${GITHUB_RUN_ID}"
          sudo -n .venv/bin/python .github/scripts/prepare_bootstrap_health.py \
            --synthetic-ci-health \
            --authority AUTH-CI-HEALTH-20261017 \
            --output-root "/opt/idis-ci-health/${GITHUB_RUN_ID}/inputs" \
            --model-path /opt/idis-models/0d3d19a32d3338f10357c0889762bd8d64bbdeba \
            --owner-uid 1000
      - name: Mask maintenance secrets and separate that directory
        id: mask-maintenance
        if: success()
        run: |
          set -euo pipefail
          sudo -n GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" .venv/bin/python - <<'H1B_PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          run = os.environ["GITHUB_RUN_ID"]
          root = Path(f"/opt/idis-ci-health/{run}/inputs")
          held = Path(f"/opt/idis-ci-health/{run}/maintenance")
          os.replace(root / "maintenance", held)
          payload = json.loads((held / "bootstrap.json").read_text())
          admin = urlsplit(payload["IDIS_DATABASE_ADMIN_URL"])
          password = unquote(admin.password or "")
          print(f"::add-mask::{payload['IDIS_DATABASE_ADMIN_URL']}")
          print(f"::add-mask::{password}")
          for name in (
              "application_password",
              "erasure_password",
              "redis_password",
              "neo4j_password",
          ):
              print(f"::add-mask::{payload[name]}")
          fields = (
              ("POSTGRES_USER", "postgres"),
              ("POSTGRES_PASSWORD", password),
              ("REDIS_PASSWORD", payload["redis_password"]),
          )
          lines = []
          for name, value in fields:
              if not re.fullmatch(r"[A-Za-z0-9_-]+", value):
                  raise SystemExit(1)
              lines.append(name + "=" + value)
          env_path = Path(f"/opt/idis-ci-health/{run}/datastore.env")
          flags = os.O_CREAT + os.O_EXCL + os.O_WRONLY
          fd = os.open(env_path, flags, 0o600)
          with os.fdopen(fd, "w") as handle:
              handle.write("\n".join(lines) + "\n")
          print(json.dumps({"phase": "maintenance", "moved": True}, sort_keys=True))
          H1B_PY
      - name: Create the network-none namespace and disposable datastores
        id: disposable-datastores
        if: success()
        run: |
          set -euo pipefail
          sudo -n GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" .venv/bin/python - <<'H1B_PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          run = os.environ["GITHUB_RUN_ID"]
          image = "idis:ci-" + os.environ["GITHUB_SHA"]
          holder = f"idis-h1b-netns-{run}"
          env_path = Path(f"/opt/idis-ci-health/{run}/datastore.env")
          child_env = os.environ.copy()
          for line in env_path.read_text().splitlines():
              name, value = line.split("=", 1)
              child_env[name] = value
          profile = Path(f"/opt/idis-ci-health/{run}/inputs/api/synthetic-bootstrap.env")
          values = {}
          for line in profile.read_text().splitlines():
              name, raw = line.split("=", 1)
              values[name] = json.loads(raw)
          objects = Path(values["IDIS_OBJECT_STORE_BASE_DIR"])
          if objects.parent.parent != Path("/var/lib/idis-ci-health"):
              raise SystemExit(1)
          objects.parent.mkdir(parents=True, exist_ok=True)
          objects.mkdir(mode=0o700)
          os.chmod(objects, 0o700)
          os.chmod(objects.parent, 0o700)
          os.chown(objects, 1000, 1000)
          os.chown(objects.parent, 1000, 1000)
          pointer = Path(f"/opt/idis-ci-health/{run}/object-store-parent")
          pointer.write_text(str(objects.parent) + "\n")
          os.chmod(pointer, 0o600)
          Path(f"/opt/idis-ci-health/{run}/object-path").write_text(str(objects) + "\n")
          subprocess.check_call(
              [
                  "docker", "run", "-d", "--name", holder,
                  "--network", "none",
                  "--entrypoint", "python", image,
                  "-c", "import time; time.sleep(10000000)",
              ]
          )
          mode = subprocess.check_output(
