          expected = [
              "python", "-m", "idis.runtime.strict_launcher", "api",
              "--host", "0.0.0.0", "--port", "8000",
              "--pid-file", "/tmp/idis-api.pid",
          ]
          inspected = json.loads(subprocess.check_output(["docker", "inspect", api], text=True))
          entry = inspected[0] if isinstance(inspected, list) and inspected else {}
          path = entry.get("Path") if isinstance(entry, dict) else None
          args = entry.get("Args") if isinstance(entry, dict) else None
          exact = (
              isinstance(path, str)
              and isinstance(args, list)
              and all(isinstance(item, str) for item in args)
              and [path, *args] == expected
          )
          print(json.dumps({"phase": "cmdline", "exact": exact}, sort_keys=True))
          if not exact:
              raise SystemExit(1)
          H1B_PY
      - name: Test container health check
        id: container_health
        if: success()
        run: |
          set -euo pipefail
          api="idis-h1b-api-${GITHUB_RUN_ID}"
          echo "=== Waiting for container to start ==="
          sleep 10
          echo "=== Checking health endpoint ==="
          ok=0
          i=1
          while [ "$i" -le 30 ]; do
            if docker exec "$api" curl -sf http://127.0.0.1:8000/health > /tmp/idis-health-body.json; then
              python3 -c 'import json; body=json.load(open("/tmp/idis-health-body.json")); assert body["status"]=="ok" and body["version"]=="6.3"'
