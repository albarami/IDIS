          import json, os, runpy, sys, time
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import SQLAlchemyError
          from sqlalchemy.pool import NullPool
          payload = json.loads(Path("/maintenance/bootstrap.json").read_text())
          admin = urlsplit(payload["IDIS_DATABASE_ADMIN_URL"])
          password = unquote(admin.password or "")
          os.environ["IDIS_CI_ERASURE_ADMIN_URL"] = (
              "postgresql+psycopg2://postgres:" + password + "@127.0.0.1:5432/postgres"
          )
          url = os.environ["IDIS_CI_ERASURE_ADMIN_URL"]
          deadline = time.time() + 90
          ready = False
          while time.time() < deadline:
              try:
                  engine = create_engine(url, poolclass=NullPool, connect_args={"connect_timeout": 2})
                  with engine.connect() as connection:
                      connection.execute(text("SELECT 1"))
                  engine.dispose()
                  ready = True
                  break
              except SQLAlchemyError:
                  time.sleep(2)
