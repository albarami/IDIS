              ok=1
              break
            fi
            echo "Attempt ${i}: waiting..."
            sleep 2
            i=$((i + 1))
          done
          log="/opt/idis-ci-health/${GITHUB_RUN_ID}/maintenance/api-container.log"
          set +e
          if docker container inspect "$api" >/dev/null 2>&1; then
