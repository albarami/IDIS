[project]
name = "idis"
version = "6.3.0"
description = "IDIS - Institutional Deal Intelligence System (VC Edition)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Salim Al-Barami" }]
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.27.0",
    "pydantic==2.12.5",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.26.0",
    "httpx2>=2.13.1",  # current Starlette TestClient response/error family
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "langgraph>=0.0.40",
    "pypdf>=4.0.0,<6.13",  # <6.13: pypdf 6.13.0 regressed PDF text extraction (no_text_extracted on valid PDFs)
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "faster-whisper==1.2.1",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "anthropic==0.125.0",  # qualified frozen temperature-bearing requests; SDK 1.x rejects them
    "cryptography>=42.0.0,<47",  # AES-256-GCM BYOL credential encryption; also used by auth_sso JWKS verification
    "python-dotenv>=1.0.0",
    "neo4j>=5.14.0",
    "openai>=1.40.0",
    "redis>=5.0.0",  # cross-replica rate-limit store (Slice96 DEC-A); imported lazily when configured
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-socket>=0.8.1",  # explicit network denial for offline qualification
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "types-openpyxl>=3.1.0.0",
    "py-make>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# This lock qualifies Python 3.11 only; --python-version alone is a lower bound.
environments = ["python_version == '3.11' and (sys_platform == 'win32' or sys_platform == 'linux')"]

[tool.hatch.build.targets.wheel]
packages = ["src/idis"]

[tool.hatch.build.targets.wheel.force-include]
"openapi/IDIS_OpenAPI_v6_3.yaml" = "idis/_openapi/IDIS_OpenAPI_v6_3.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["scripts/dev_only/"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "UP038",  # deprecated in ruff >=0.15; isinstance(x, (A, B)) is valid Python
]

[tool.ruff.lint.per-file-ignores]
"scripts/run_task7_v11_current_guard_census.py" = ["B009", "B010", "F401"]
"scripts/run_task7_v9_current_guard_census.py" = ["I001"]
"scripts/run_task8_v26_sql_authority_census.py" = ["E501", "I001"]
"tests/slice100_task8/test_v26_sql_authority_postgres_census_red.py" = ["E501", "F841", "I001", "SIM300"]

[tool.ruff.format]
exclude = [
    "scripts/generate_task7_v6_contract_fixture.py",
    "scripts/generate_task7_v9_contract_fixture.py",
    "scripts/generate_task7_v21_contract_fixture.py",
    "scripts/materialize_full_strict_v21_preimage.py",
    "scripts/run_task7_v11_current_guard_census.py",
    "scripts/run_task7_v21_current_guard_census.py",
    "scripts/run_task7_v9_current_guard_census.py",
    "tests/slice100_task7/test_full_strict_v9_native_schema_red.py",
    "scripts/materialize_full_strict_v26_preimage.py",
    "scripts/run_task8_v26_signed_census.py",
    "scripts/run_task8_v26_sql_authority_census.py",
    "tests/slice100_task8/test_full_strict_v26_materialization_red.py",
    "tests/slice100_task8/test_v26_bound_runtime_graph_red.py",
    "tests/slice100_task8/test_v26_sql_authority_postgres_census_red.py",
]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["neo4j.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx.*", "pdf2image.*", "pytesseract.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
